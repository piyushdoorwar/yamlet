<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connect to Yamlet</title>
    <link rel="stylesheet" href="popup.css">
    <script defer src="confirm.js"></script>
  </head>
  <body class="confirm">
    <header>
      <svg class="logo" width="30" height="30" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="2" y="2" width="60" height="60" rx="14" fill="#0e7a43"/>
        <rect x="12" y="12" width="40" height="40" rx="10" fill="none" stroke="#fff" stroke-width="3.4"/>
        <path d="M24 25 L32 34 L40 25 M32 34 L32 45" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="title">
        <strong>Yamlet</strong>
        <span>Interceptor</span>
      </div>
    </header>
    <main>
      <h2>Connect to this Yamlet?</h2>
      <p id="base" class="site mono">Checking…</p>
      <p>Cookies from the sites you approve will be sent to this address. Connect only if you just chose <b>Pair extension</b> in Yamlet.</p>
      <div id="status" class="status" role="status" hidden></div>
      <button id="connect" type="button" class="btn btn-primary btn-block" disabled>Connect</button>
      <button id="cancel" type="button" class="btn btn-cancel btn-block">Cancel</button>
    </main>
  </body>
</html>
