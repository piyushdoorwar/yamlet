name: Build artifacts

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix (e.g. 1.2.3)"
        required: true
        default: "0.0.0-dev"

permissions:
  contents: write

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Run unit tests
        run: dotnet test src/Yamlet.Tests --configuration Release

  linux-deb:
    name: Linux Debian package
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build .deb
        run: ./scripts/build-linux.sh
        env:
          VERSION: ${{ steps.ver.outputs.version }}

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v5
        with:
          name: yamlet-linux-amd64-deb
          path: artifacts/packages/*.deb

      - name: Attach .deb to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/packages/*.deb

  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build installer
        shell: pwsh
        run: ./scripts/build-windows.ps1
        env:
          VERSION: ${{ steps.ver.outputs.version }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: yamlet-windows-x64-setup
          path: artifacts/packages/*_setup.exe

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v5
        with:
          name: yamlet-windows-x64-msix
          path: artifacts/packages/*.msix

      - name: Attach installer and MSIX to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/packages/*_setup.exe
            artifacts/packages/*.msix
