name: Publish CLI to NuGet

# Packs src/Yamlet.Cli as a dotnet global tool (Yamlet.Cli) and pushes it to nuget.org.
# Requires a repository secret NUGET_API_KEY (a nuget.org API key with push rights to the
# Yamlet.Cli package id — reserve the id once before the first publish).
#
# Triggers: v* tags (real releases), and manual dispatch (test/manual publish).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix (e.g. 1.2.3)"
        required: true
        default: "0.0.0-dev"

jobs:
  publish:
    name: Pack and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Run unit tests
        run: dotnet test src/Yamlet.Tests --configuration Release

      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: >
          dotnet pack cli/Yamlet.Cli/Yamlet.Cli.csproj
          --configuration Release
          -p:Version=${{ steps.ver.outputs.version }}
          --output artifacts

      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
