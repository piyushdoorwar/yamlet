name: Verify samples

# Installs the latest published Yamlet.Cli from nuget.org and runs the sample workspace, so
# every commit exercises the released tool end to end the same way a consumer would use it.
#
# Requires Yamlet.Cli to already be on nuget.org (see publish-cli.yml) — runs will fail at
# the install step until the first publish. The sample hits the public
# jsonplaceholder.typicode.com API, so the runner needs internet (GitHub-hosted runners do)
# but no secrets.

on:
  push:
  workflow_dispatch:

jobs:
  verify:
    name: Run sample collections
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install latest Yamlet CLI from nuget.org
        # Retry to ride out the propagation window: nuget.org lists a freshly published
        # package on the gallery a little before its restore endpoints (flat container /
        # search index) catch up, so an install right after a publish can briefly 404.
        run: |
          for attempt in 1 2 3 4 5 6; do
            if dotnet tool install --global Yamlet.Cli; then
              echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
              exit 0
            fi
            echo "Install attempt ${attempt} failed; retrying in 30s..."
            sleep 30
          done
          echo "::error::Could not install Yamlet.Cli from nuget.org after several attempts."
          exit 1

      - name: Run sample workspace
        run: yamlet run samples/demo --env samples/demo/environments/dev.yaml
