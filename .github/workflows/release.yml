# On a v* tag (pushed with git, or created by publishing a release in the GitHub
# UI): publish versioned container images, publish the CLI to npm, and create the
# GitHub release if it doesn't exist yet (the site's releases page reads it).
#   ghcr.io/piyushdoorwar/yamlet:1.2.3, :1.2, :1 and :latest (pre-releases
#   such as v1.3.0-beta.1 only get their exact version tag)
#   npm install -g @piyushdoorwar/yamlet@1.2.3
#   yamlet-interceptor-1.2.3.zip (extension, manifest version stamped from the tag)
#   attached to the GitHub release for the Chrome Web Store upload
# Needs the NPM_TOKEN repository secret (an npm automation token).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/piyushdoorwar/yamlet

jobs:
  image:
    name: Container image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cli:
    name: CLI to npm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Build and publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          YAMLET_VERSION="$VERSION" npm run build:cli
          cd cli
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          TAG=latest; case "$VERSION" in *-*) TAG=next;; esac
          npm publish --provenance --access public --tag "$TAG"

  extension:
    name: Extension package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: bash extension/package.sh "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: dist/yamlet-interceptor-*.zip

  github-release:
    name: GitHub release
    needs: [image, cli, extension]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: extension
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Publishing a release from the GitHub UI creates the tag that started this
          # run, so the release may already exist; keep its text as written.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; attaching the extension only."
            gh release upload "$GITHUB_REF_NAME" dist/yamlet-interceptor-*.zip --clobber
            exit 0
          fi
          PRERELEASE=""; case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/yamlet-interceptor-*.zip --generate-notes --verify-tag $PRERELEASE
