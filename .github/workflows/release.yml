# On a v* tag: publish versioned container images, publish the CLI to npm, and
# create the GitHub release (which the site's releases page reads).
#   ghcr.io/piyushdoorwar/yamlet:1.2.3, :1.2, :1 and :latest (pre-releases
#   such as v1.3.0-beta.1 only get their exact version tag)
#   npm install -g @piyushdoorwar/yamlet@1.2.3
# Needs the NPM_TOKEN repository secret (an npm automation token).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/piyushdoorwar/yamlet

jobs:
  image:
    name: Container image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cli:
    name: CLI to npm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Build and publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm run build:cli
          cd cli
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          TAG=latest; case "$VERSION" in *-*) TAG=next;; esac
          npm publish --provenance --access public --tag "$TAG"

  github-release:
    name: GitHub release
    needs: [image, cli]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""; case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag $PRERELEASE
