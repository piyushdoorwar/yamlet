$kind: http-request
url: "{{baseUrl}}/posts/{{postId}}"
method: GET
scripts:
  - type: afterResponse
    code: |
      pm.test('status is 200', () => pm.expect(pm.response.code).to.equal(200));
      pm.test('returns the requested post', () => pm.expect(pm.response.json().id).to.equal(1));
    language: text/javascript
order: 2000
id: demo-get-post
