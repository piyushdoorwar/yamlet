$kind: http-request
url: "{{baseUrl}}/posts"
method: POST
body:
  type: json
  content: |
    {
      "title": "Yamlet",
      "body": "Created from the sample collection",
      "userId": {{$randomInt}}
    }
scripts:
  - type: afterResponse
    code: |
      pm.test('status is 201', () => pm.expect(pm.response.code).to.equal(201));
      pm.test('echoes a new id', () => pm.expect(pm.response.json().id).to.above(0));
    language: text/javascript
order: 3000
id: demo-create-post
