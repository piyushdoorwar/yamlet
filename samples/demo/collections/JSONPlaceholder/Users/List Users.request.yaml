$kind: http-request
url: "{{baseUrl}}/users"
method: GET
scripts:
  - type: afterResponse
    code: |
      pm.test('status is 200', () => pm.expect(pm.response.code).to.equal(200));
      pm.test('returns users', () => pm.expect(pm.response.json().length).to.above(0));
    language: text/javascript
order: 1000
id: demo-list-users
