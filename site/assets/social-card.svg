<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Yamlet</title>
  <desc id="description">Local-first API client for Git-friendly YAML collections</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#DDE5E0" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FCFCFC" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#FCFCFC" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FCFCFC" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#FCFCFC"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#fade)"/>
  <rect x="0" y="0" width="1200" height="8" fill="#0E7A43"/>

  <g transform="translate(88 104) scale(1.75)">
    <rect x="11" y="11" width="42" height="42" rx="12" fill="#FFFFFF" stroke="#0E7A43" stroke-width="3.4"/>
    <path d="M24 25 L32 34 L40 25 M32 34 L32 45" fill="none" stroke="#0E7A43" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="96" y="318" fill="#0F1A14" font-family="DM Sans, Inter, Segoe UI, sans-serif" font-size="104" font-weight="700" letter-spacing="-3">Yamlet</text>
  <text x="100" y="384" fill="#24302A" font-family="DM Sans, Inter, Segoe UI, sans-serif" font-size="34" font-weight="500">Local-first API client for</text>
  <text x="100" y="428" fill="#24302A" font-family="DM Sans, Inter, Segoe UI, sans-serif" font-size="34" font-weight="500">Git-friendly YAML collections</text>
  <g font-family="DM Sans, Inter, Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#0E7A43">
    <rect x="100" y="476" width="166" height="44" rx="22" fill="#0E7A43" fill-opacity="0.1"/>
    <text x="183" y="505" text-anchor="middle">Runs locally</text>
    <rect x="280" y="476" width="150" height="44" rx="22" fill="#0E7A43" fill-opacity="0.1"/>
    <text x="355" y="505" text-anchor="middle">Plain YAML</text>
    <rect x="444" y="476" width="168" height="44" rx="22" fill="#0E7A43" fill-opacity="0.1"/>
    <text x="528" y="505" text-anchor="middle">No telemetry</text>
  </g>

  <!-- Mini product mock -->
  <g transform="translate(690 120)">
    <rect x="0" y="0" width="440" height="390" rx="14" fill="#FFFFFF" stroke="#DDE5E0" stroke-width="2"/>
    <path d="M14 0H426A14 14 0 0 1 440 14V44H0V14A14 14 0 0 1 14 0Z" fill="#F5F8F6"/>
    <line x1="0" y1="44" x2="440" y2="44" stroke="#DDE5E0" stroke-width="2"/>
    <circle cx="24" cy="22" r="6" fill="#D5DDD8"/><circle cx="44" cy="22" r="6" fill="#D5DDD8"/><circle cx="64" cy="22" r="6" fill="#D5DDD8"/>
    <rect x="150" y="11" width="190" height="22" rx="6" fill="#FFFFFF" stroke="#DDE5E0"/>
    <text x="245" y="27" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#6B7A71">localhost:7878</text>

    <rect x="20" y="64" width="400" height="44" rx="8" fill="#FFFFFF" stroke="#DDE5E0" stroke-width="2"/>
    <text x="36" y="92" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#A35F00">POST</text>
    <line x1="92" y1="74" x2="92" y2="98" stroke="#DDE5E0" stroke-width="2"/>
    <rect x="104" y="76" width="96" height="22" rx="4" fill="#D69614" fill-opacity="0.16"/>
    <text x="108" y="92" font-family="JetBrains Mono, monospace" font-size="15" fill="#8A5A00">{{baseUrl}}</text>
    <text x="204" y="92" font-family="JetBrains Mono, monospace" font-size="15" fill="#0F1A14">/posts</text>
    <rect x="336" y="72" width="76" height="28" rx="6" fill="#0E7A43"/>
    <text x="374" y="91" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Send</text>

    <text x="20" y="144" font-family="DM Sans, sans-serif" font-size="15" font-weight="700" fill="#0F1A14">Response</text>
    <rect x="300" y="128" width="112" height="24" rx="5" fill="#0E7A43" fill-opacity="0.1"/>
    <text x="356" y="145" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#0B6537">201 Created</text>

    <rect x="20" y="164" width="400" height="206" rx="8" fill="#F6F8F7" stroke="#DDE5E0" stroke-width="2"/>
    <g font-family="JetBrains Mono, monospace" font-size="15">
      <text x="38" y="196" fill="#0F1A14">{</text>
      <text x="56" y="224"><tspan fill="#0B6537">"id"</tspan><tspan fill="#0F1A14">: </tspan><tspan fill="#1D5FC4">101</tspan><tspan fill="#0F1A14">,</tspan></text>
      <text x="56" y="252"><tspan fill="#0B6537">"title"</tspan><tspan fill="#0F1A14">: </tspan><tspan fill="#8A5A00">"Hello from Yamlet"</tspan><tspan fill="#0F1A14">,</tspan></text>
      <text x="56" y="280"><tspan fill="#0B6537">"userId"</tspan><tspan fill="#0F1A14">: </tspan><tspan fill="#1D5FC4">1</tspan><tspan fill="#0F1A14">,</tspan></text>
      <text x="56" y="308"><tspan fill="#0B6537">"published"</tspan><tspan fill="#0F1A14">: </tspan><tspan fill="#1D5FC4">true</tspan></text>
      <text x="38" y="336" fill="#0F1A14">}</text>
    </g>
  </g>
  <text x="100" y="584" fill="#6B7A71" font-family="JetBrains Mono, monospace" font-size="20">piyushdoorwar.github.io/yamlet</text>
</svg>
